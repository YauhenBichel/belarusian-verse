<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 507 154" width="507" height="154" role="img" aria-label="Terminal output of be-poetry for a two-line Belarusian verse: rhythm per line and a rich rhyme between lines 1 and 2">
<rect width="507" height="154" rx="10" fill="#0d1117" stroke="#30363d"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<text x="24" y="28" fill="#7ee787" xml:space="preserve">$ be-poetry verse.txt --rhyme AABB</text>
<text x="24" y="47" fill="#e6edf3" xml:space="preserve"> 1 100111001    rhythm 0.78  Белы туман па лесе плыве,</text>
<text x="24" y="66" fill="#e6edf3" xml:space="preserve"> 2 101000101    rhythm 0.67  Свежасць ранішняя тут жыве.</text>
<text x="24" y="85" fill="#e6edf3" xml:space="preserve">dominant rhythm: 101111101</text>
<text x="24" y="104" fill="#e3b341" xml:space="preserve">rhyme 1-2: rich (1.0)</text>
<text x="24" y="123" fill="#e3b341" xml:space="preserve">rhyme 1.0  rhythm 0.73</text>
</g>
</svg>
