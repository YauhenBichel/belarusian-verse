[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belarusian-verse"
version = "0.2.0"
description = "Belarusian stress, rhyme, rhythm and agreement checking, built on the Belarusian Grammar Database"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yauhen Bichel" }]
keywords = ["belarusian", "stress", "rhyme", "poetry", "grammar", "morphology", "lyrics", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["huggingface_hub>=0.24"]

[project.optional-dependencies]
spelling = ["spylls>=0.1.7"]

[project.urls]
Homepage = "https://github.com/YauhenBichel/belarusian-verse"
Dataset = "https://huggingface.co/datasets/YauhenBichel/belarusian-verse"

[project.scripts]
be-stress = "belarusian_verse.stress:main"
be-poetry = "belarusian_verse.poetry:main"
be-grammar = "belarusian_verse.grammar:main"
be-spelling = "belarusian_verse.spelling:main"
be-respell = "belarusian_verse.respell:main"
be-rhymes = "belarusian_verse.rhymes:main"

[tool.hatch.build.targets.wheel]
packages = ["src/belarusian_verse"]
