name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The tables (about 14 MB) are downloaded from the dataset on first use.
      # Caching keeps the Hugging Face hub out of every matrix leg.
      - name: Cache the Belarusian tables
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: belarusian-verse-tables-v1

      - name: Install
        run: python -m pip install -e ".[spelling]"

      - name: Tests
        run: python -m unittest discover -s tests -q

      # Proves the commands work with no PYTHONPATH and no repository paths, and that a
      # Belarusian line survives the console encoding (Windows defaults to cp1252).
      - name: Installed commands
        shell: bash
        run: |
          printf '%s\n%s\n' 'Жоўты ліст плыве па вадзе,' 'Побач ты, і восень ідзе.' > verse.txt
          be-stress verse.txt --report
          be-grammar verse.txt          # exits non-zero if an adjective disagrees
          be-poetry verse.txt --rhyme AA  # exits non-zero if the rhyme or rhythm is weak
          be-respell verse.txt --target uk
