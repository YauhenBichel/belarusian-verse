name: Release

# Publishes a tagged version to PyPI with Trusted Publishing (OIDC) — no API
# token is stored anywhere. Configure it once at
# https://pypi.org/manage/project/belarusian-verse/settings/publishing/
# with owner YauhenBichel, repository belarusian-verse, workflow release.yml.
#
# Tag first, then run this workflow with the same tag:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing semver tag to publish (vMAJOR.MINOR.PATCH, for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Require a semver tag
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[spelling]"

      - name: Tests on the tagged commit
        run: python -m unittest discover -s tests -q

      - name: The tag must match the version in pyproject.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          packaged="v$(python -c 'import belarusian_verse; print(belarusian_verse.__version__)')"
          test "$packaged" = "$VERSION" || { echo "pyproject has $packaged, tag is $VERSION"; exit 1; }

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing; no stored credentials
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
